openapi: 3.2.0
info:
  title: Documentation for your Premium plan Weather API
  description: 'This interactive documentation lets you try real API requests. Select an endpoint on the left and read its description for details about the available parameters. Click `Test Request` to open the interactive API client, fill in the parameters, and press `Send` to view a full API response. You can then inspect the JSON response, copy the `curl` command to run it on your machine, or obtain a URL of the request.


    The Meteosource API is a RESTful API. Requests are made with `GET` and query parameters; responses are JSON-encoded, except where noted (e.g. the weather map endpoints return `image/png`).


    ### Base URL

    The base URL for this documentation is `https://www.meteosource.com/api/v1/premium`.


    ### Authentication

    Requests are authenticated with your unique API key, supplied in one of these ways:

    * the `key` query parameter

    * the `X-API-Key` header

    * the `Authorization: Bearer ` header


    Specifying the `key` query parameter together with either header is rejected with a `403` error, as is specifying none of them. If both headers are present, `X-API-Key` takes precedence and `Authorization` is ignored. You can find and manage your API key in your dashboard.


    ### Errors

    The API returns standard HTTP status codes. Error responses include a JSON body with a `detail` field describing the problem:

    ```json

    { "detail": "explanation of what went wrong" }

    ```

    Common error codes: `400` (invalid parameter), `402` (daily request limit exceeded), `403` (API key missing, invalid, or specified twice), `429` (per-minute rate limit exceeded).


    ### Pagination

    The Meteosource API does not use pagination - all results for a request are returned at once.


    ### Important notes


    * For a detailed description of the response variables, consult the response `Schema`

    * Don''t assume a fixed set or order of variables and sections - new ones may be added over time. Always check a field is present before using it.

    * The response includes an `Expires` header marking when the data will next change. Use it to avoid unnecessary requests and improve your app''s performance.

    * HTTP compression is supported - add an `Accept-Encoding: gzip` header to enable it.'
  version: v1
servers:
- url: https://www.meteosource.com/api/v1/premium
tags:
- name: Weather
  description: 'This section contains endpoints for retrieving current, forecast, and historical weather data for a single location.


    For every endpoint in this section, location is a required parameter (some endpoints also

    require other parameters, e.g. `date`), and can be specified in one of two ways:


    1. GPS coordinates, using the `lat` and `lon` parameters.

    2. **OR** A place name, using the `place_id` parameter. Obtain a `place_id` from one of the endpoints in the Locations section in this API documentation.


    ### Notes

    * When daylight saving time starts, one hourly record will be missing (typically `2:00:00 AM`). When daylight saving time ends, the hourly data will contain two records with duplicate times (typically `2:00:00 AM`).

    * For mountains, it is usually better to specify the `place_id` rather than the `lat` and `lon`. When you use `place_id`, you are guaranteed to receive data for the precise elevation of the peak. When you specify the coordinates, the elevation can be less precise.

    * **Weather icon fields** (e.g. `status_num`) return a numeric code; see the `WeatherIconCode` schema description for the full mapping of codes to their icon names and descriptions.'
paths:
  /point:
    get:
      tags:
      - Weather
      summary: Get weather data
      description: '## Current weather and forecast for single location


        ### Sections

        The endpoint can return multiple sections of data. To obtain the best performance, we advise only requesting the sections you actually need. The available sections are as follows:


        * Current weather situation

        * Hourly forecast (for 24/48/96/168 hours, depending on the tier)

        * Daily forecast (for 7/10/30 days, depending on the tier)

        * Minutely precipitation forecast (for 60 minutes in the following hour, only for higher tiers)

        * Weather alerts (only for higher tiers)


        By default, only the current and hourly sections are returned. The division into daily parts (morning, afternoon and evening) is only available for the first 7 days of the forecast. For details regarding available parameters, see the parameter description below.


        ### Notes

        * Variables can be instantaneous, averaged, or accumulated over certain time. For example, `precipitation` forecast provides the precipitation accumulated until the next hour (data with timestamp as `12:00:00` is rain accumulated from `12:00:00` to `13:00:00`).

        * The detailed description of weather alerts is only available in English. The alert category is translated into selected language.'
      operationId: point_point_get
      security:
      - APIKeyHeader: []
      - AuthorizationHeader: []
      parameters:
      - name: place_id
        in: query
        required: false
        schema:
          type: string
          description: Identifier of a place. To obtain the `place_id` for the location you want, please use endpoints `/find_places_prefix` (search by prefix) or `/find_places` (search by full name).
        description: Identifier of a place. To obtain the `place_id` for the location you want, please use endpoints `/find_places_prefix` (search by prefix) or `/find_places` (search by full name).
      - name: lat
        in: query
        required: false
        schema:
          type: string
          description: Latitude in format 12N, 12.3N, 12.3, or 13S, 13.2S, -13.4
        description: Latitude in format 12N, 12.3N, 12.3, or 13S, 13.2S, -13.4
      - name: lon
        in: query
        required: false
        schema:
          type: string
          description: Longitude in format 12E, 12.3E, 12.3, or 13W, 13.2W, -13.4
        description: Longitude in format 12E, 12.3E, 12.3, or 13W, 13.2W, -13.4
      - name: sections
        in: query
        required: false
        schema:
          type: string
          description: "Sections to be included in the response. You can specify more section by separating the values with a comma. The available values are:\n\n* ``current``: Current weather situation\n* ``daily``: Forecasts for each whole day, without the daily parts\n* ``daily-parts``: Forecasts for each whole day, morning, afternoon and evening\n    * Important: forecast for the morning, afternoon and evening is available only for the first\n      7 days in the forecast\n* ``hourly``: Forecasts with hourly resolution\n* ``minutely``: Precipitation forecast with 1 minute resolution\n* ``alerts``: The weather alerts\n* ``all``: All sections\n"
          default: current,hourly
        description: "Sections to be included in the response. You can specify more section by separating the values with a comma. The available values are:\n\n* ``current``: Current weather situation\n* ``daily``: Forecasts for each whole day, without the daily parts\n* ``daily-parts``: Forecasts for each whole day, morning, afternoon and evening\n    * Important: forecast for the morning, afternoon and evening is available only for the first\n      7 days in the forecast\n* ``hourly``: Forecasts with hourly resolution\n* ``minutely``: Precipitation forecast with 1 minute resolution\n* ``alerts``: The weather alerts\n* ``all``: All sections\n"
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          description: 'Timezone to be used for the date fields. If not specified, local timezone of the forecast location will be used.

            The format is according to the tzinfo database, so values like `Europe/Prague` or `UTC` can be used.

            Alternatively you may use the value ``auto`` in which case the local timezone of the location is used.

            The full list of valid timezone strings can be found [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).

            '
        description: 'Timezone to be used for the date fields. If not specified, local timezone of the forecast location will be used.

          The format is according to the tzinfo database, so values like `Europe/Prague` or `UTC` can be used.

          Alternatively you may use the value ``auto`` in which case the local timezone of the location is used.

          The full list of valid timezone strings can be found [here](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).

          '
      - name: language
        in: query
        required: false
        schema:
          type: string
          enum:
          - cs
          - en
          - de
          - es
          - fr
          - pl
          - pt
          x-enumDescriptions:
            cs: Czech
            de: German
            en: English
            es: Spanish
            fr: French
            pl: Polish
            pt: Portuguese
          description: The language of text summaries and place names (variable names are never translated).
          default: en
        description: The language of text summaries and place names (variable names are never translated).
      - name: units
        in: query
        required: false
        schema:
          type: string
          enum:
          - auto
          - metric
          - us
          - uk
          - ca
          x-enumDescriptions:
            auto: Select the system automatically, based on the forecast location.
            ca: Same as `metric`, except that wind speeds are in `km/h` and pressure is in `kPa`.
            metric: Metric (SI) units (`°C`, `mm/h`, `m/s`, `cm`, `km`, `hPa`).
            uk: Same as `metric`, except that visibility is in `miles` and wind speeds are in `mph`.
            us: Imperial units (`°F`, `in/h`, `mph`, `in`, `mi`, `Hg`).
          description: 'Unit system to be used.

            '
          default: auto
        description: 'Unit system to be used.

          '
      - name: key
        in: query
        required: false
        schema:
          type: string
          description: Your unique API key. You can either specify it in this parameter, or set it in `X-API-Key` header.
        description: Your unique API key. You can either specify it in this parameter, or set it in `X-API-Key` header.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Point_PointData'
                - type: 'null'
        '400':
          description: Error in passed parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralRequestError'
        '403':
          description: API key not specified or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralRequestError'
        '402':
          description: Maximum requests per day limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralRequestError'
        '429':
          description: Maximum requests per minute limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralRequestError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
