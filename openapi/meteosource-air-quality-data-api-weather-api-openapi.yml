  /time_machine:
    get:
      tags:
      - Weather
      summary: Get historical weather data
      description: 'Get weather data for a single location (specified either by geographic coordinates or by a place ID) and a given day in the past.


        ### Sections

        The response is split into following sections:


        * `data`: Actual hourly weather records for the requested day, available up to 20 years in the past.

        * `daily`: Daily summary (average, minimum, and maximum) computed from that same day''s hourly records in `data`.

        * `statistics`: Long-term climate normals for this calendar day (e.g. every August 14th, regardless of year) - typical averages plus all-time record extremes, computed from around 40 years of historical data.'
      operationId: time_machine_time_machine_get
      security:
      - APIKeyHeader: []
      - AuthorizationHeader: []
      parameters:
      - name: place_id
        in: query
        required: false
        schema:
          type: string
          description: Identifier of a place. To obtain the `place_id` for the location you want, please use endpoints `/find_places_prefix` (search by prefix) or `/find_places` (search by full name).
        description: Identifier of a place. To obtain the `place_id` for the location you want, please use endpoints `/find_places_prefix` (search by prefix) or `/find_places` (search by full name).
      - name: lat
        in: query
        required: false
        schema:
          type: string
          description: Latitude in format 12N, 12.3N, 12.3, or 13S, 13.2S, -13.4
        description: Latitude in format 12N, 12.3N, 12.3, or 13S, 13.2S, -13.4
      - name: lon
        in: query
        required: false
        schema:
          type: string
          description: Longitude in format 12E, 12.3E, 12.3, or 13W, 13.2W, -13.4
        description: Longitude in format 12E, 12.3E, 12.3, or 13W, 13.2W, -13.4
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: 'The day of the data in the past. Specify in `YYYY-MM-DD` format, e.g. `2021-08-24`.

            '
        description: 'The day of the data in the past. Specify in `YYYY-MM-DD` format, e.g. `2021-08-24`.

