components:
  schemas:
    Point_PointHourlyProbData:
      properties:
        precipitation:
          type: integer
          description: 'Probability of non-zero precipitation.

            Unit: \%'
        storm:
          type: number
          description: 'Total precipitation amount accumulated since last hour.

            Unit: mm/h'
        freeze:
          type: number
          description: 'Probability the temperature drops below 0 °C.

            Unit: \%'
      type: object
      title: Point_PointHourlyProbData
    Point_PointCurrentData:
      properties:
        icon:
          type: string
          description: String identifier of current weather icon, e.g. `light_rain`.
        icon_num:
          $ref: '#/components/schemas/WeatherIconCode'
          description: Numeric identifier of current weather icon. See the [`WeatherIconCode`](#models/WeatherIconCode) schema description for the full list of possible values.
        summary:
          type: string
          description: Short text summary of current weather, e.g. `Light rain`.
        temperature:
          type: number
          description: 'Current temperature 2 metres above ground.

            Units: metric = °C, us = °F, uk = °C, ca = °C'
        feels_like:
          type: number
          description: 'Feels like temperature.

            Units: metric = °C, us = °F, uk = °C, ca = °C'
        soil_temperature:
          type: number
          description: 'Soil temperature, corresponding to the temperature approximately 5 cm below the ground surface.

            Units: metric = °C, us = °F, uk = °C, ca = °C'
        wind_chill:
          type: number
          description: 'Windchill temperature.

            Units: metric = °C, us = °F, uk = °C, ca = °C'
        surface_temperature:
          type: number
          description: 'Ground (surface) temperature.

            Units: metric = °C, us = °F, uk = °C, ca = °C'
        dew_point:
          type: number
          description: 'Current dew point temperature.

            Units: metric = °C, us = °F, uk = °C, ca = °C'
        wind:
          anyOf:
          - $ref: '#/components/schemas/Point_PointCurrentWindData'
          - type: 'null'
        precipitation:
          anyOf:
          - $ref: '#/components/schemas/Point_PointCurrentPrecipitationData'
          - type: 'null'
        probability:
          anyOf:
          - $ref: '#/components/schemas/Point_PointCurrentProbData'
          - type: 'null'
        cloud_cover:
          type: number
          description: 'Percentage of sky covered by clouds.

            Unit: \%'
        cape:
          type: number
          description: 'Convective available potential energy.

            Unit: J/kg'
        evaporation:
          type: number
          description: 'Evaporation of liquid water into water vapor.

            Unit: mm/h'
        lftx:
          type: number
          description: 'Surface lifted index.

            Unit: K'
        snow_depth:
          type: number
          description: 'Snow depth.

            Units: metric = cm, us = inch, uk = cm, ca = cm'
        sunshine_duration:
          type: number
          description: 'Sunshine duration since start of previous hour.

            Unit: s'
        irradiance:
          type: number
          description: 'Global downward short-wave radiation flux.

            Unit: W/m2'
        ozone:
          type: number
          description: 'Total column of ozone.

            Unit: Dobson'
        pressure:
          type: number
          description: 'Atmospheric pressure at mean sea level.

            Units: metric = hPa, us = Hg, uk = hPa, ca = kPa'
        uv_index:
          type: number
          description: 'UV index, values from zero (low risk of harm) to 11+ (extreme risk of harm).

            Unit: uv_index'
        humidity:
          type: integer
          description: 'Relative humidity.

            Unit: \%'
        visibility:
          type: number
          description: 'Visibility.

            Units: metric = km, us = mi, uk = mi, ca = km'
      type: object
      title: Point_PointCurrentData
    TimeMachine_PointDailyStatsWindData:
      properties:
        avg_speed:
          type: number
          description: 'Long-term average wind speed.

            Units: metric = m/s, us = mph, uk = mph, ca = km/h'
        avg_angle:
          type: number
          description: 'Long-term average wind angle.

            Unit: deg'
        avg_dir:
          type: string
          description: 'Long-term average wind direction in ''N'', ''NNE'', ''NE'', ... ''NNW'' format.

            Unit: 16-point compass direction (N, NNE, NE, ..., NNW)'
        max_speed:
          type: number
          description: 'Historical daily maximum wind speed.

            Units: metric = m/s, us = mph, uk = mph, ca = km/h'
        max_gust:
          type: number
          description: 'Historical daily maximum wind gust speed.

            Units: metric = m/s, us = mph, uk = mph, ca = km/h'
      type: object
      title: TimeMachine_PointDailyStatsWindData
    AirQuality_PointData:
      properties:
        lat:
          type: string
          description: Latitude of the point, always in the format <float><N/S>, for example ``23.5S``
        lon:
          type: string
          description: Longitude of the point, always in the format <float><E/W>, for example ``23.5W``
        elevation:
          type: integer
          description: Elevation above sea level in metres (for units 'metric', 'uk', 'ca') or feet (for units 'us')
        timezone:
          type: string
          description: Name of the timezone in format like 'Europe/London'.
        data:
          items:
            $ref: '#/components/schemas/AirQuality_PointHourlyData'
          type: array
      type: object
      title: AirQuality_PointData
    Point_PointCurrentProbData:
      properties:
        precipitation:
          type: integer
          description: 'Probability of non-zero precipitation.

            Unit: \%'
        storm:
          type: number
          description: 'Storm probability.

            Unit: \%'
        freeze:
          type: number
          description: 'Probability the temperature drops below 0 °C.

            Unit: \%'
      type: object
      title: Point_PointCurrentProbData
    Point_PointDailyEveningWindData:
      properties:
        speed:
          type: number
          description: 'Units: metric = m/s, us = mph, uk = mph, ca = km/h'
        gusts:
          type: number
          description: 'Wind gust speed. (evening max)

            Units: metric = m/s, us = mph, uk = mph, ca = km/h'
        dir:
          type: string
          description: 'Evening wind direction in `N`, `NNE`, `NE`, ..., `NNW` format.

            Unit: 16-point compass direction (N, NNE, NE, ..., NNW)'
        angle:
          type: number
          description: 'Evening wind direction angle in degrees, 180° means wind from the south.

            Unit: degrees'
      type: object
      title: Point_PointDailyEveningWindData
    HTTPValidationError:
      properties:
